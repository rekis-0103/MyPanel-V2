x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  prepare-controller-secrets:
    image: alpine:3.22
    entrypoint: ["sh", "-ec"]
    command:
      - |
        cp /run/secrets/postgres_password /output/postgres_password
        cp /run/secrets/redis_password /output/redis_password
        cp /run/secrets/admin_password /output/admin_password
        chown 65532:65532 /output/*
        chmod 0400 /output/*
    user: "0:0"
    secrets:
      - postgres_password
      - redis_password
      - admin_password
    volumes:
      - controller-secrets:/output
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *default-logging

  certgen:
    build:
      context: ./controller
    entrypoint: ["/certgen"]
    environment:
      CERT_OUTPUT_DIR: /certs
    user: "0:0"
    volumes:
      - mtls-certs:/certs
    network_mode: none
    restart: "no"
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mypanel
      POSTGRES_USER: mypanel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypanel -d mypanel"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8-alpine
    entrypoint: ["sh", "-ec"]
    command: ["exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: postgres:17-alpine
    entrypoint: ["sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        for migration in /migrations/*.sql; do
          psql -h postgres -U mypanel -d mypanel -v ON_ERROR_STOP=1 -f "$$migration"
        done
    secrets:
      - postgres_password
    volumes:
      - ./controller/migrations:/migrations:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  bootstrap:
    build:
      context: ./controller
    entrypoint: ["/controller", "bootstrap-owner"]
    environment:
      DATABASE_PASSWORD_FILE: /run/mypanel-secrets/postgres_password
      ADMIN_PASSWORD_FILE: /run/mypanel-secrets/admin_password
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    volumes:
      - controller-secrets:/run/mypanel-secrets:ro
    networks:
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      prepare-controller-secrets:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *default-logging

  agent:
    build:
      context: ./controller
    entrypoint: ["/agent"]
    environment:
      AGENT_ADDR: :8081
      AGENT_TLS_CERT_FILE: /run/mypanel-certs/agent.crt
      AGENT_TLS_KEY_FILE: /run/mypanel-certs/agent.key
      AGENT_TLS_CA_FILE: /run/mypanel-certs/ca.crt
      AGENT_DATA_ROOT: /var/lib/mypanel/servers
      AGENT_BACKUP_ROOT: /var/lib/mypanel/backups
      AGENT_META_ROOT: /var/lib/mypanel/meta
      MINECRAFT_IMAGE: ${MINECRAFT_IMAGE:-}
      MINECRAFT_IMAGE_JAVA_21: ${MINECRAFT_IMAGE_JAVA_21:-}
      MINECRAFT_IMAGE_JAVA_25: ${MINECRAFT_IMAGE_JAVA_25:-itzg/minecraft-server:java25}
      DOCKER_SOCKET: /var/run/docker.sock
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/mypanel:/var/lib/mypanel
      - mtls-certs:/run/mypanel-certs:ro
    networks:
      - control
    depends_on:
      certgen:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  controller:
    build:
      context: ./controller
    environment:
      HTTP_ADDR: :8080
      DATABASE_PASSWORD_FILE: /run/mypanel-secrets/postgres_password
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD_FILE: /run/mypanel-secrets/redis_password
      AGENT_URL: https://agent:8081
      AGENT_CA_FILE: /run/mypanel-certs/ca.crt
      AGENT_CERT_FILE: /run/mypanel-certs/controller.crt
      AGENT_KEY_FILE: /run/mypanel-certs/controller.key
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_ORIGIN: ${TRUSTED_ORIGIN:-http://127.0.0.1:8080}
      GAME_BIND_IP: ${GAME_BIND_IP:-0.0.0.0}
      PORT_RANGE_START: ${PORT_RANGE_START:-25565}
      PORT_RANGE_END: ${PORT_RANGE_END:-25749}
      NODE_MEMORY_MB: ${NODE_MEMORY_MB:-12288}
      NODE_CPUS: ${NODE_CPUS:-7}
    volumes:
      - mtls-certs:/run/mypanel-certs:ro
      - controller-secrets:/run/mypanel-secrets:ro
    networks:
      - edge
      - control
      - data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      prepare-controller-secrets:
        condition: service_completed_successfully
      certgen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/controller", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ./web
    user: "1000:1000"
    networks:
      - edge
    depends_on:
      controller:
        condition: service_healthy
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /data:size=16m,mode=0750,uid=1000,gid=1000
      - /config:size=8m,mode=0750,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./secrets/redis_password}
  admin_password:
    file: ${ADMIN_PASSWORD_FILE:-./secrets/admin_password}

volumes:
  postgres-data:
  redis-data:
  mtls-certs:
  controller-secrets:

networks:
  edge:
  control:
    internal: true
  data:
    internal: true
